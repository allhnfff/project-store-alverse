<title>AL STORE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style id="app-css">
/* Monokrom dari logo AL STORE: blok hitam untuk brand, area terang untuk katalog.
   Ganti palet hanya di blok PALET DASAR; turunan dihitung otomatis. */
:root{
  color-scheme: light;
  /* PALET DASAR */
  --color-bg:#F1F1F1; --color-surface:#FFFFFF; --color-text:#000000; --color-muted:#575757;
  --color-border:#D6D6D6; --color-accent:#000000; --color-on-accent:#FFFFFF;
  --color-inverse:#000000; --color-on-inverse:#FFFFFF; --color-danger:#B3261E;
  /* AKSEN: perak metalik, hanya untuk Best Seller (label dan harga di kartu hitam). Teks di atasnya selalu hitam. */
  --color-highlight:#D9DCE1; --color-on-highlight:#000000;
  --silver: linear-gradient(135deg, #F7F8F9 0%, #C5C9CF 38%, #EEF0F2 52%, #A8ADB4 74%, #E3E5E8 100%);
  /* TURUNAN */
  --color-surface-sunken: color-mix(in srgb, var(--color-text) 4%, var(--color-surface));
  --color-border-strong: color-mix(in srgb, var(--color-text) 42%, var(--color-border));
  --color-accent-hover: color-mix(in srgb, var(--color-accent) 82%, var(--color-surface));
  --color-accent-soft: color-mix(in srgb, var(--color-accent) 6%, var(--color-surface));
  --color-on-inverse-muted: color-mix(in srgb, var(--color-on-inverse) 72%, var(--color-inverse));
  --color-inverse-line: color-mix(in srgb, var(--color-on-inverse) 22%, var(--color-inverse));
  --color-inverse-hover: color-mix(in srgb, var(--color-on-inverse) 12%, var(--color-inverse));
  --color-danger-soft: color-mix(in srgb, var(--color-danger) 8%, var(--color-surface));
  --color-focus: var(--color-text);
  --shadow-md: 0 10px 28px -14px color-mix(in srgb, var(--color-text) 35%, transparent);
  --shadow-lg: 0 24px 64px -16px color-mix(in srgb, var(--color-text) 50%, transparent);
  /* TIPOGRAFI: Archivo lebar untuk judul (menggemakan logo), normal untuk teks */
  --font: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --wide: 125%;
  --fs-xs: 12.5px; --fs-sm: 13.5px; --fs-base: 15px; --fs-md: 17px;
  --fs-lg: clamp(22px, 1.2vw + 16px, 28px);
  --fs-xl: clamp(30px, 3.2vw + 16px, 60px);
  /* BENTUK & RUANG: sudut kecil meniru sudut tajam logo */
  --radius-sm: 4px; --radius-md: 6px; --radius-lg: 12px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px; --space-8:72px;
  --container: 1200px; --gutter: 16px; --header-h: 60px; --bar-h: 64px;
  --ease: cubic-bezier(.2,.7,.2,1); --dur: 150ms;
}
@media (min-width: 768px){ :root{ --gutter: 32px; --header-h: 68px; } }
.inverse{ background: var(--color-inverse); color: var(--color-on-inverse); --color-focus: var(--color-on-inverse); }

*, *::before, *::after{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: no-preference){ html{ scroll-behavior: smooth; } }
body{ margin: 0; font-family: var(--font); font-size: var(--fs-base); line-height: 1.6; color: var(--color-text); background: var(--color-bg); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before{ content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--color-inverse); }
img{ max-width: 100%; display: block; }
a{ color: inherit; }
button, input, select, textarea{ font: inherit; color: inherit; }
h1, h2, h3, p{ margin: 0; }
ul, ol{ margin: 0; padding: 0; }
[hidden]{ display: none !important; }
.sr-only{ position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
a[href], button, summary, select, label[for], label:has(> input[type="radio"]), label:has(> input[type="checkbox"]), input[type="radio"], input[type="checkbox"], input[type="file"]{ cursor: pointer; }
:disabled, [aria-disabled="true"]{ cursor: not-allowed; }
:focus-visible{ outline: 2px solid var(--color-focus); outline-offset: 2px; }
.container{ width: 100%; max-width: calc(var(--container) + var(--gutter) * 2); margin-inline: auto;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
section[id], div[id="faq"], div[id="trust"]{ scroll-margin-top: calc(var(--header-h) + 12px); }
.num{ font-variant-numeric: tabular-nums; }
.display{ font-stretch: var(--wide); font-weight: 800; letter-spacing: -.01em; }
.ic{ width: 1.15em; height: 1.15em; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; }
.diamond{ display: inline-block; flex: 0 0 auto; width: 7px; height: 7px; background: currentColor; transform: rotate(45deg); }
.skip-link{ position: absolute; left: var(--space-4); top: -60px; z-index: 100; background: var(--color-on-inverse); color: var(--color-inverse); padding: var(--space-2) var(--space-4); border-radius: var(--radius-sm); font-weight: 700; text-decoration: none; }
.skip-link:focus{ top: var(--space-2); }

/* Tombol: primary (isi hitam), secondary (garis), ghost */
.btn{ display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: 44px; padding: 0 var(--space-4); border-radius: var(--radius-sm); border: 1px solid transparent; font-weight: 700; font-size: var(--fs-sm); line-height: 1.2; text-decoration: none; white-space: nowrap; background: none;
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.btn-primary{ background: var(--color-accent); color: var(--color-on-accent); }
.btn-primary:hover{ background: var(--color-accent-hover); }
.btn-secondary{ background: var(--color-surface); border-color: var(--color-border-strong); color: var(--color-text); }
.btn-secondary:hover{ border-color: var(--color-text); background: var(--color-surface-sunken); }
.btn-ghost{ background: transparent; color: var(--color-text); border-color: var(--color-border); }
.btn-ghost:hover{ background: var(--color-surface-sunken); border-color: var(--color-border-strong); }
.btn-danger{ background: var(--color-danger); color: #FFFFFF; }
.btn-danger:hover{ background: color-mix(in srgb, var(--color-danger) 85%, #000000); }
.btn-lg{ min-height: 52px; padding: 0 var(--space-5); font-size: var(--fs-base); }
.btn-sm{ min-height: 40px; padding: 0 var(--space-3); }
.btn-icon{ width: 44px; padding: 0; }
.btn:active{ transform: translateY(1px); }
.btn:disabled{ opacity: .45; transform: none; }
.inverse .btn-primary{ background: var(--color-on-inverse); color: var(--color-inverse); }
.inverse .btn-primary:hover{ background: color-mix(in srgb, var(--color-on-inverse) 86%, var(--color-inverse)); }
.inverse .btn-secondary{ background: transparent; color: var(--color-on-inverse); border-color: var(--color-on-inverse-muted); }
.inverse .btn-secondary:hover{ border-color: var(--color-on-inverse); background: var(--color-inverse-hover); }
.text-link{ font-weight: 700; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.text-link:hover{ text-decoration-thickness: 2px; }

/* Header */
.site-header{ position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; border-bottom: 1px solid var(--color-inverse-line); }
.header-inner{ display: flex; align-items: center; gap: var(--space-4); min-height: var(--header-h); }
.brand{ display: flex; align-items: center; gap: var(--space-3); text-decoration: none; margin-right: auto; min-width: 0; }
.brand-mark{ width: 40px; height: 40px; flex: 0 0 auto; background: var(--color-inverse); border: 1px solid var(--color-inverse-line); border-radius: var(--radius-sm); display: grid; place-items: center; overflow: hidden; }
.brand-mark img{ width: 100%; height: 100%; object-fit: cover; transform: scale(1.6); }
.brand-monogram{ font-weight: 800; font-stretch: var(--wide); font-size: 13px; color: var(--color-on-inverse); }
.brand-name{ display: block; font-stretch: var(--wide); font-weight: 800; font-size: 18px; letter-spacing: .02em; line-height: 1.1; }
.brand-text{ transition: opacity var(--dur) var(--ease); }
body[data-route="store"].hero-visible .brand-text{ opacity: 0; visibility: hidden; }
.brand-tag{ display: block; font-size: var(--fs-xs); color: var(--color-on-inverse-muted); line-height: 1.3; margin-top: 2px; }
.nav{ display: flex; gap: var(--space-1); }
.nav a{ padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); color: var(--color-on-inverse-muted); font-weight: 600; font-size: var(--fs-sm); text-decoration: none; transition: color var(--dur) var(--ease), background-color var(--dur) var(--ease); }
.nav a:hover{ color: var(--color-on-inverse); background: var(--color-inverse-hover); }
.menu-toggle{ display: none; align-items: center; gap: var(--space-2); min-height: 44px; padding: 0 var(--space-3); border-radius: var(--radius-sm); border: 1px solid var(--color-on-inverse-muted); background: transparent; color: var(--color-on-inverse); font-weight: 700; font-size: var(--fs-sm); }
.menu-toggle:hover{ background: var(--color-inverse-hover); }
.mobile-menu{ border-top: 1px solid var(--color-inverse-line); padding-block: var(--space-2) var(--space-4); }
.mobile-menu nav{ display: grid; }
.mobile-menu a{ display: flex; align-items: center; gap: var(--space-3); min-height: 52px; padding: 0 var(--space-2); border-bottom: 1px solid var(--color-inverse-line); font-weight: 700; text-decoration: none; }
.mobile-menu a:last-child{ border-bottom: 0; }
.mobile-menu a:hover{ background: var(--color-inverse-hover); }
.mobile-menu .diamond{ color: var(--color-on-inverse-muted); }
.admin-chip{ display: inline-flex; align-items: center; gap: var(--space-2); }
@media (max-width: 860px){ .nav, .header-cta{ display: none; } .menu-toggle{ display: inline-flex; } }
@media (max-width: 400px){ .brand-tag{ display: none; } }
@media (min-width: 861px){ .mobile-menu{ display: none !important; } }
body[data-route="admin"] .nav, body[data-route="admin"] .header-cta, body[data-route="admin"] .menu-toggle{ display: none; }

.preview-banner{ background: var(--color-surface); border-bottom: 1px solid var(--color-border-strong); font-size: var(--fs-sm); }
.preview-banner .container{ display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; padding-block: var(--space-2); }

/* Hero: kunci merek seperti gambar pratinjau link (logo | nama | tagline) */
.hero{ position: relative; padding-block: var(--space-7); overflow: hidden; isolation: isolate; }
.hero-inner{ display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); flex-wrap: wrap; }
.lockup{ display: flex; align-items: center; gap: var(--space-5); min-width: 0; }
.lockup-mark{ flex: 0 0 auto; width: 112px; height: 112px; padding-right: var(--space-5); border-right: 1px solid var(--color-inverse-line); box-sizing: content-box; }
.lockup-mark img{ width: 100%; height: 100%; }
.lockup-text{ min-width: 0; }
.lockup-name{ font-stretch: var(--wide); font-weight: 800; font-size: clamp(34px, 4.6vw + 12px, 76px); line-height: .95; letter-spacing: .01em; overflow-wrap: anywhere; }
.lockup-tag{ margin-top: var(--space-3); font-size: var(--fs-md); line-height: 1.45; color: var(--color-on-inverse-muted); max-width: 34ch; }
.lockup-tag span{ display: block; }
.lockup-tag span:empty{ display: none; }
.hero-actions{ display: flex; gap: var(--space-3); flex-wrap: wrap; }
@media (max-width: 860px){
  .hero{ padding-block: var(--space-6); }
  .hero-actions{ display: none; }
}
@media (max-width: 639px){
  .hero{ padding-block: var(--space-5) var(--space-6); }
  .lockup{ gap: var(--space-4); }
  .lockup-mark{ width: 64px; height: 64px; padding-right: var(--space-4); }
  .lockup-tag{ margin-top: var(--space-2); font-size: var(--fs-sm); }
}

/* Tile logo produk */
.tile{ flex: 0 0 auto; width: 48px; height: 48px; border-radius: var(--radius-sm); background: #FFFFFF; border: 1px solid var(--color-border); display: grid; place-items: center; overflow: hidden; }
.tile img{ width: 100%; height: 100%; object-fit: contain; padding: 6px; }
.tile-fallback{ width: 100%; height: 100%; display: grid; place-items: center; background: var(--color-surface-sunken); color: var(--color-text); font-weight: 800; font-stretch: var(--wide); font-size: 14px; }
.tile-lg{ width: 64px; height: 64px; }
.tile-lg img{ padding: 8px; }
.tile-lg .tile-fallback{ font-size: 19px; }

/* Katalog */
.section{ padding-block: var(--space-7); }
.catalog, .contact-section{ background: var(--color-surface); }
.section-head{ margin-bottom: var(--space-5); max-width: 62ch; }
.section-head h2, .block-title{ font-size: var(--fs-lg); line-height: 1.15; font-stretch: var(--wide); font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
.section-head p{ margin-top: var(--space-2); color: var(--color-muted); }
.catalog-head{ display: flex; align-items: center; justify-content: space-between; gap: var(--space-3) var(--space-5); flex-wrap: wrap; margin-bottom: var(--space-4); }
.catalog-head .search{ flex: 0 1 460px; }
@media (max-width: 639px){ .catalog-head .search{ flex-basis: 100%; } }
.chipbar{ position: sticky; top: calc(var(--header-h) + env(safe-area-inset-top, 0px)); z-index: 30; background: var(--color-surface); padding-block: var(--space-2); border-bottom: 1px solid var(--color-border); }
.toolbar{ display: grid; gap: var(--space-4); margin-bottom: var(--space-2); }
.search{ position: relative; max-width: 560px; }
.search > .ic{ position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--color-muted); pointer-events: none; }
.search input{ width: 100%; height: 50px; padding: 0 50px 0 44px; border-radius: var(--radius-sm); border: 1px solid var(--color-border-strong); background: var(--color-surface); font-size: 16px; }
.search input::placeholder{ color: var(--color-muted); opacity: 1; }
.search input:hover{ border-color: var(--color-text); }
.search input:focus-visible{ outline: none; border-color: var(--color-text); box-shadow: 0 0 0 2px var(--color-text); }
.search input::-webkit-search-cancel-button{ -webkit-appearance: none; appearance: none; }
.search-clear{ position: absolute; right: 3px; top: 3px; width: 44px; height: 44px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--color-muted); display: grid; place-items: center; }
.search-clear:hover{ background: var(--color-surface-sunken); color: var(--color-text); }
.chips{ display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chip{ display: inline-flex; align-items: center; gap: var(--space-2); min-height: 40px; padding: 0 var(--space-3); border-radius: var(--radius-sm); border: 1px solid var(--color-border-strong); background: var(--color-surface); font-size: var(--fs-sm); font-weight: 700; white-space: nowrap; }
.chip:hover{ border-color: var(--color-text); }
.chip-count{ font-size: var(--fs-xs); font-weight: 600; color: var(--color-muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"]{ background: var(--color-accent); border-color: var(--color-accent); color: var(--color-on-accent); }
.chip[aria-pressed="true"] .chip-count{ color: color-mix(in srgb, var(--color-on-accent) 75%, var(--color-accent)); }
@media (max-width: 639px){
  .chips{ flex-wrap: nowrap; overflow-x: auto; margin-inline: calc(var(--gutter) * -1); padding: 2px var(--gutter); scrollbar-width: none;
    -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); }
  .chips::-webkit-scrollbar{ display: none; }
  .chips::after{ content: ""; flex: 0 0 24px; }
}
.toolbar-foot{ display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); padding-top: var(--space-3); }
.result-count{ font-size: var(--fs-sm); color: var(--color-muted); }
.result-count b{ color: var(--color-text); }
.sort{ display: flex; align-items: center; gap: var(--space-2); font-size: var(--fs-sm); color: var(--color-muted); }
.select{ height: 40px; padding: 0 34px 0 var(--space-3); border-radius: var(--radius-sm); border: 1px solid var(--color-border-strong); background-color: var(--color-surface); font-size: var(--fs-sm); font-weight: 700; color: var(--color-text); appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.select:hover{ border-color: var(--color-text); }
/* Katalog gaya pricelist: baris rapat bergaris tipis, 1 kolom di HP, 2 kolom di laptop */
.product-grid{ list-style: none; display: grid; grid-template-columns: minmax(0, 1fr); column-gap: var(--space-7); border-top: 2px solid var(--color-text); }
@media (min-width: 760px){ .product-grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.product-grid > li{ display: flex; border-bottom: 1px solid var(--color-border); }
.product{ width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-areas: "media name price" "media meta price"; column-gap: var(--space-3); align-items: center; min-height: 68px; padding: var(--space-3) var(--space-2); text-align: left; border: 0; background: transparent; transition: background-color var(--dur) var(--ease); }
.product:hover{ background: var(--color-surface-sunken); }
.product:active{ background: color-mix(in srgb, var(--color-text) 8%, var(--color-surface)); }
.product:focus-visible{ outline-offset: -2px; }
.product .tile{ grid-area: media; width: 44px; height: 44px; }
.product .tile img{ padding: 5px; }
.product-name{ grid-area: name; align-self: end; font-weight: 700; font-size: var(--fs-base); line-height: 1.3; overflow-wrap: anywhere; }
.product-meta{ grid-area: meta; align-self: start; display: flex; flex-wrap: wrap; align-items: center; gap: 2px var(--space-2); font-size: var(--fs-xs); color: var(--color-muted); line-height: 1.5; }
.product-price{ grid-area: price; text-align: right; line-height: 1.2; }
.product-price small{ display: block; color: var(--color-muted); font-size: var(--fs-xs); font-weight: 500; }
.product-price b{ font-size: var(--fs-md); font-weight: 800; font-stretch: 112%; white-space: nowrap; }
.product-flag, .feature-flag{ align-self: start; justify-self: end; display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 3px; background: var(--color-inverse); color: var(--color-highlight); font-size: 11.5px; font-weight: 800; letter-spacing: .02em; line-height: 1.5; white-space: nowrap; }
.feature-flag{ grid-area: flag; }
.product-flag{ padding: 0 6px; font-size: 11px; }
.mark{ background: var(--silver); color: var(--color-on-highlight); padding: 1px 5px; border-radius: 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.product-count{ display: flex; align-items: center; gap: 6px; padding-bottom: 3px; font-size: var(--fs-xs); font-weight: 700; white-space: nowrap; }
@media (max-width: 639px){ .product-price b{ font-size: var(--fs-base); } }
.empty{ border: 1px dashed var(--color-border-strong); border-radius: var(--radius-md); padding: var(--space-6) var(--space-5); text-align: center; }
.empty h3{ font-size: var(--fs-md); font-weight: 800; }
.empty p{ margin-top: var(--space-2); color: var(--color-muted); }
.empty .actions{ display: flex; gap: var(--space-2); justify-content: center; flex-wrap: wrap; margin-top: var(--space-4); }

/* Etalase andalan (geser ke samping) + grup kategori */
.group-head{ display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); margin: var(--space-7) 0 var(--space-2); }
.group-head h3{ font-size: var(--fs-md); font-weight: 800; font-stretch: var(--wide); line-height: 1.2; }
.group-count{ margin-left: var(--space-2); font-size: var(--fs-sm); font-weight: 600; font-stretch: 100%; color: var(--color-muted); font-variant-numeric: tabular-nums; }
.group-hint{ font-size: var(--fs-xs); color: var(--color-muted); white-space: nowrap; }
.showcase .group-head{ margin-top: var(--space-4); }
.rail{ list-style: none; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, calc((100% - 3 * var(--space-4)) / 4)); gap: var(--space-4); overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; padding-bottom: var(--space-2); scrollbar-width: thin; }
.rail > li{ display: flex; scroll-snap-align: start; }
.feature{ width: 100%; display: grid; grid-template-columns: 64px 1fr; grid-template-rows: auto auto 1fr auto; grid-template-areas: "media flag" "name name" "desc desc" "foot foot"; text-align: left; padding: var(--space-4); border-radius: var(--radius-md); border: 1px solid var(--color-inverse); background: var(--color-inverse); color: var(--color-on-inverse); --color-focus: var(--color-text); transition: background-color var(--dur) var(--ease); }
.feature:hover{ background: color-mix(in srgb, var(--color-on-inverse) 10%, var(--color-inverse)); }
.feature .tile{ grid-area: media; border-color: var(--color-inverse-line); }
.feature-name{ grid-area: name; margin-top: var(--space-4); font-size: var(--fs-md); font-weight: 800; font-stretch: 112%; line-height: 1.25; overflow-wrap: anywhere; }
.feature-desc{ grid-area: desc; margin-top: var(--space-1); font-size: var(--fs-sm); color: var(--color-on-inverse-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.feature-foot{ grid-area: foot; display: flex; justify-content: space-between; align-items: flex-end; gap: var(--space-3); margin-top: var(--space-5); }
.feature-foot small{ display: block; font-size: var(--fs-xs); color: var(--color-on-inverse-muted); }
.feature-foot b{ font-size: 19px; font-weight: 800; font-stretch: 112%; }
.feature-foot .product-count{ color: var(--color-on-inverse); }

/* Kilatan Best Seller: garis cahaya menyapu label dan kartu etalase, bergantian antarkartu. */

.product-flag::after, .feature-flag::after{ content: ""; position: absolute; top: -4px; bottom: -4px; left: 0; width: 45%; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.9), transparent); transform: translateX(-160%) skewX(-20deg); animation: flag-shine 3.2s ease-in-out infinite; }
.feature{ position: relative; overflow: hidden; isolation: isolate; }
.feature::before{ content: ""; position: absolute; z-index: 1; top: 0; bottom: 0; left: 0; width: 55%; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.18), transparent); transform: translateX(-120%) skewX(-18deg); animation: card-shine 5s ease-in-out infinite; }
.rail > li:nth-child(2) .feature::before, .rail > li:nth-child(2) .feature-flag::after{ animation-delay: .5s; }
.rail > li:nth-child(3) .feature::before, .rail > li:nth-child(3) .feature-flag::after{ animation-delay: 1s; }

.rail > li:nth-child(5) .feature::before, .rail > li:nth-child(5) .feature-flag::after{ animation-delay: 2s; }
@keyframes flag-shine{ 0%{ transform: translateX(-160%) skewX(-20deg); } 35%, 100%{ transform: translateX(260%) skewX(-20deg); } }
@keyframes card-shine{ 0%, 55%{ transform: translateX(-120%) skewX(-18deg); } 85%, 100%{ transform: translateX(220%) skewX(-18deg); } }

const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clone = (o) => JSON.parse(JSON.stringify(o));
const normalize = (t) => String(t || "").toLowerCase().trim();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ic = (n) => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const waLink = (num, text) => `https://wa.me/${num}` + (text ? `?text=${encodeURIComponent(text)}` : "");
const hash = (s) => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return String(h >>> 0); };
const catLabel = (k) => (CATEGORIES.find((c) => c.key === k) || {}).label || "Lainnya";
const safeUrl = (u) => /^https:\/\//i.test(String(u || "").trim()) ? String(u).trim() : "";

function parsePrice(raw) {
  const s = String(raw ?? "").trim();
  const m = s.match(/^([\d.,\s]*\d)(.*)$/);
  if (!m) return { value: NaN, text: s };
  const value = Number(m[1].replace(/\D/g, ""));
  return { value, text: "Rp" + value.toLocaleString("id-ID") + m[2].trim() };
}
function initials(title) {
  const words = String(title || "").replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/).filter((w) => w && !/^(premium|pro|vip)$/i.test(w));
  return (words.slice(0, 2).map((w) => w[0]).join("") || "?").toUpperCase();
}
function imgSrc(o) {
  if (o && o.logoAsset && /^[0-9a-f]{32}$/i.test(o.logoAsset)) return "/_blob/" + o.logoAsset;
  return safeUrl(o && o.logo);
}
function mediaHTML(p, size) {
  const cls = "tile" + (size ? " tile-" + size : "");
  const px = size === "lg" ? 64 : 48;
  const ini = esc(initials(p.title));
  const src = imgSrc(p);
  if (!src) return `<span class="${cls}"><span class="tile-fallback" aria-hidden="true">${ini}</span></span>`;
  return `<span class="${cls}"><img src="${esc(src)}" alt="" width="${px}" height="${px}" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-initials="${ini}"></span>`;
}
function monogram(name) { return (String(name || "").trim().split(/\s+/)[0] || "?").slice(0, 3).toUpperCase(); }
function brandMarkHTML(store) {
  const src = imgSrc({ logoAsset: store.logoAsset });
  return src ? `<img src="${esc(src)}" alt="" width="40" height="40" data-monogram="${esc(monogram(store.name))}">`
             : `<span class="brand-monogram" aria-hidden="true">${esc(monogram(store.name))}</span>`;
}

// Gambar gagal dimuat: inisial / monogram / sembunyikan logo hero
document.addEventListener("error", (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement)) return;
  if (img.dataset.initials) {
    const s = document.createElement("span"); s.className = "tile-fallback"; s.setAttribute("aria-hidden", "true"); s.textContent = img.dataset.initials; img.replaceWith(s);
  } else if (img.dataset.monogram) {
    const s = document.createElement("span"); s.className = "brand-monogram"; s.setAttribute("aria-hidden", "true"); s.textContent = img.dataset.monogram; img.replaceWith(s);
  } else if (img.dataset.hero) {
    const box = img.closest(".lockup-mark"); if (box) box.hidden = true;
  }
}, true);

let toastTimer;
function toast(msg, ms = 2400) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (_) {
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (_) {} ta.remove(); return ok;
  }
}

function enrich(p) {
  const pkgs = (p.prices || []).map(([name, price]) => ({ name, ...parsePrice(price) }));
  const valid = pkgs.filter((x) => !Number.isNaN(x.value));
  const cheapest = valid.reduce((a, b) => (b.value < a.value ? b : a), valid[0] || { value: 0, text: "-" });
  return { ...p, pkgs, min: cheapest.value, minText: cheapest.text };
}
function storeProducts() { return view().products.filter((p) => !p.hidden).map(enrich); }

function renderChips() {

  $("#chips").innerHTML = CATEGORIES.map((c) => {

    return `<button class="chip" type="button" data-cat="${c.key}" aria-pressed="${c.key === state.cat}">${esc(c.label)} <span class="chip-count">${n}</span></button>`;
  }).join("");
}
function cardHTML(p, flag = true) {
  const n = p.pkgs.length, f = flag && p.featured;
  return `<li><button class="product" type="button" data-id="${esc(p.id)}" aria-label="${esc(p.title)}.${p.desc ? " " + esc(p.desc) + "." : ""} ${n} paket, mulai ${esc(p.minText)}${f ? ". Best Seller" : ""}. Lihat paket">

    <span class="product-price"><small>mulai</small><b class="num">${esc(p.minText)}</b></span></button></li>`;
}
function featureHTML(p) {
  const n = p.pkgs.length;
  return `<li><button class="feature" type="button" data-id="${esc(p.id)}" aria-label="${esc(p.title)}.${p.desc ? " " + esc(p.desc) + "." : ""} ${n} paket, mulai ${esc(p.minText)}. Best Seller. Lihat paket">
    ${mediaHTML(p, "lg")}<span class="feature-flag">Best Seller</span>
    <span class="feature-name">${esc(p.title)}</span><span class="feature-desc">${esc(p.desc)}</span>
    <span class="feature-foot"><span><small>mulai</small><b class="num"><span class="mark">${esc(p.minText)}</span></b></span><span class="product-count">${n} paket ${ic("right")}</span></span></button></li>`;
}
function applyFilters() {
  const q = $("#q"), term = normalize(q.value);
  $("#clearQ").hidden = !term;
  const all = storeProducts();
  if (!all.some((p) => p.cat === state.cat)) state.cat = "all";
  const list = all.filter((p) => {
    const hay = normalize([p.title, p.desc, catLabel(p.cat), ...(p.prices || []).flat()].join(" "));
    return (!term || hay.includes(term)) && (state.cat === "all" || p.cat === state.cat);
  });
  switch ($("#sort").value) {
    case "az": list.sort((a, b) => a.title.localeCompare(b.title, "id")); break;
    case "za": list.sort((a, b) => b.title.localeCompare(a.title, "id")); break;
    case "low": list.sort((a, b) => a.min - b.min); break;
    case "high": list.sort((a, b) => b.min - a.min); break;
    default: break; // Rekomendasi = urutan yang diatur admin
  }
  // Tampilan awal (tanpa cari/filter/urutan): etalase andalan + daftar per kategori.
  const grouped = !term && state.cat === "all" && $("#sort").value === "reco" && list.length > 0;
  const grid = $("#grid"), groups = $("#groups"), show = $("#showcase");
  const feats = grouped ? list.filter((p) => p.featured) : [];
  show.hidden = !feats.length;
  $("#rail").innerHTML = feats.map(featureHTML).join("");
  if (feats.length) requestAnimationFrame(() => { const r = $("#rail"); $("#showcaseHint").dataset.fits = String(r.scrollWidth <= r.clientWidth + 1); });
  groups.hidden = !grouped;
  groups.innerHTML = grouped ? CATEGORIES.filter((c) => c.key !== "all").map((c) => {
    const items = list.filter((p) => p.cat === c.key);
    if (!items.length) return "";
    return `<section aria-labelledby="g-${c.key}"><div class="group-head"><h3 id="g-${c.key}">${esc(c.label)}<span class="group-count">${items.length}</span></h3></div><ul class="product-grid" role="list">${items.map((p) => cardHTML(p, false)).join("")}</ul></section>`;
  }).join("") : "";
  grid.innerHTML = grouped ? "" : list.map((p) => cardHTML(p)).join("");
  grid.hidden = grouped || !list.length; $("#empty").hidden = !!list.length;
  const filtered = term || state.cat !== "all";
  $("#resultCount").innerHTML = filtered ? `<b class="num">${list.length}</b> dari ${all.length} produk` : `<b class="num">${list.length}</b> produk`;
  if (!list.length) {
    $("#emptyTitle").textContent = term ? `“${q.value.trim()}” belum ada di katalog` : "Belum ada produk di kategori ini";
    $("#askAdmin").href = waLink(view().contact.waOrder, term ? `Halo, apakah ada ${q.value.trim()}?` : "");
  }
}

function saveDraftLocal() {
  try {
    if (dirty()) localStorage.setItem(DRAFT_KEY, JSON.stringify({ base: hash(JSON.stringify(state.data)), draft: state.draft }));
    else localStorage.removeItem(DRAFT_KEY);
  } catch (_) {}
}
let draftTimer;
function changed(opts = {}) {
  clearTimeout(draftTimer); draftTimer = setTimeout(saveDraftLocal, 400);
  updateSaveBar();
  if (opts.list) renderAdminList();
  renderChrome();
}
function updateSaveBar() {
  const bar = $("#saveBar"); bar.hidden = !(state.editor && state.route === "admin");
  if (state.publishing) return;
  const isDirty = dirty();
  $("#publishBtn").disabled = !isDirty || state.readOnly;
  $("#discardBtn").disabled = !isDirty;
  $("#saveStatus").innerHTML = state.readOnly ? "<b>Hanya bisa melihat.</b> Akun ini tidak punya izin menerbitkan halaman."
    : isDirty ? "<b>Ada perubahan yang belum diterbitkan.</b> Pembeli masih melihat versi lama." : "Semua perubahan sudah terbit.";
  $("#tabCount").textContent = `(${state.draft.products.length})`;
}

function getPath(o, p) { return p.split(".").reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, p, v) { const ks = p.split("."); const last = ks.pop(); const t = ks.reduce((a, k) => a[k], o); t[last] = v; }

  $("#e-title").value = item.title; $("#e-desc").value = item.desc;
  $("#e-cat").innerHTML = CATEGORIES.filter((c) => c.key !== "all").map((c) => `<option value="${c.key}">${esc(c.label)}</option>`).join("");
  $("#e-cat").value = item.cat;
  $("#e-featured").checked = !!item.featured; $("#e-hidden").checked = !!item.hidden;
  $("#e-title-err").hidden = true; $("#e-pkgs-err").hidden = true; $("#e-title").removeAttribute("aria-invalid");
  $("#e-logoStatus").textContent = "Logo yang diunggah tampil untuk semua pembeli. Tanpa logo, toko menampilkan inisial produk.";
  renderEditLogo(); renderPkgs();
  document.documentElement.style.overflow = "hidden";
  $("#editor").showModal(); $("#editor .sheet-body").scrollTop = 0; $("#eTitle").focus();
}
function validateProduct(it) {
  const errs = {};
  if (!it.title.trim()) errs.title = "Nama produk wajib diisi.";
  const rows = it.prices.filter((k) => String(k[0]).trim() || String(k[1]).trim());
  if (!rows.length) errs.pkgs = "Tambahkan minimal satu paket dengan harga.";
  else if (rows.some((k) => !String(k[0]).trim())) errs.pkgs = "Setiap paket perlu nama.";
  else if (rows.some((k) => Number.isNaN(parsePrice(k[1]).value))) errs.pkgs = "Setiap harga harus diawali angka, mis. 15.000 atau 35.000/bln.";
  return { errs, rows };
}
function saveEditor() {
  const it = editing.item;
  it.title = $("#e-title").value.trim(); it.desc = $("#e-desc").value.trim();
  it.cat = $("#e-cat").value; it.featured = $("#e-featured").checked; it.hidden = $("#e-hidden").checked;
  const { errs, rows } = validateProduct(it);
  $("#e-title-err").hidden = !errs.title; $("#e-title-err").textContent = errs.title || "";
  if (errs.title) $("#e-title").setAttribute("aria-invalid", "true"); else $("#e-title").removeAttribute("aria-invalid");
  $("#e-pkgs-err").hidden = !errs.pkgs; $("#e-pkgs-err").textContent = errs.pkgs || "";
  if (errs.title) { $("#e-title").focus(); return; }
  if (errs.pkgs) { renderPkgs(); $("#e-pkgs-err").scrollIntoView({ block: "nearest" }); return; }
  it.prices = rows.map((k) => [String(k[0]).trim(), String(k[1]).trim()]);
  if (editing.idx < 0) state.draft.products.unshift(it); else state.draft.products[editing.idx] = it;
  const name = it.title, wasNew = editing.idx < 0;
  editing.saved = true;
  $("#editor").close();
  changed({ list: true });
  toast(wasNew ? `${name} ditambahkan ke draf` : `Perubahan ${name} masuk draf`);
}

// ---------- terbitkan ----------
function validateAll() {
  const d = state.draft;
  if (!String(d.store.name).trim()) return { tab: "toko", el: "#f-name", msg: "Nama toko wajib diisi." };
  for (const [k, label] of [["waOrder", "Admin order"], ["waAdmin", "Admin bantuan"], ["waBot", "Bot"]]) {
    if (!/^62\d{7,13}$/.test(String(d.contact[k]))) return { tab: "toko", el: "#f-" + k, msg: `Nomor WhatsApp ${label} harus diawali 62 dan hanya angka.` };
  }
  if (!/^\d{4}$/.test(String(d.store.since))) return { tab: "toko", el: "#f-since", msg: "Tahun berdiri harus 4 angka." };
  for (const [k, label] of [["group", "grup WhatsApp"], ["instagramUrl", "Instagram"], ["telegramUrl", "Telegram"]]) {
    const v = String(d.contact[k] || "").trim();
    if (v && !safeUrl(v)) return { tab: "toko", el: { group: "#f-group", instagramUrl: "#f-igUrl", telegramUrl: "#f-tg" }[k], msg: `Link ${label} harus diawali https://` };
  }
  for (const p of d.products) { if (validateProduct(p).errs.title || validateProduct(p).errs.pkgs) return { tab: "produk", msg: `Produk "${p.title || "tanpa nama"}" belum lengkap. Buka Edit untuk memperbaikinya.` }; }
  return null;
}
function buildDocument(data) {
  const json = JSON.stringify(data).replace(/</g, "\\u003c");
  return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" + RESET_CSS + "</style></head><body>"
    + "<title>" + esc(data.store.name || "Toko") + "</title>\n" + PAGE_HEAD
    + '<style id="app-css">' + SOURCE.css + "</style>\n"
    + '<template id="app-shell">' + SOURCE.shell + "</template>\n"
    + '<div id="app"></div>\n'
    + '<script type="application/json" id="store-data">' + json + "<\/script>\n"
    + '<script id="app-js">' + SOURCE.js + "<\/script>"
    + "</body></html>";
}
async function publish() {
  if (state.publishing || !dirty()) return;
  const bad = validateAll();
  if (bad) {
    showTab(bad.tab); $("#saveStatus").innerHTML = "<b>Belum bisa terbit.</b> " + esc(bad.msg);
    if (bad.el) { const el = $(bad.el); el.setAttribute("aria-invalid", "true"); el.focus(); }
    return;
  }
  if (!state.artifact) { $("#saveStatus").innerHTML = "<b>Tidak bisa menyimpan dari tampilan ini.</b> Buka halaman ini di claude.ai dengan akun pemilik."; return; }
  state.publishing = true;
  $("#publishBtn").disabled = true; $("#discardBtn").disabled = true;
  $("#saveStatus").innerHTML = "<b>Menerbitkan…</b> Halaman akan dimuat ulang setelah tersimpan.";
  saveDraftLocal();
  let attempt = 0;
  for (;;) {
    try {
      await state.artifact.publish(buildDocument(state.draft));
      try { localStorage.removeItem(DRAFT_KEY); } catch (_) {}
      $("#saveStatus").innerHTML = "<b>Terbit.</b> Memuat versi baru…";
      return;
    } catch (e) {
      const code = e && e.code;
      if (code === "upstream_error" && attempt === 0) { attempt++; await new Promise((r) => setTimeout(r, 800 + Math.random() * 800)); continue; }
      state.publishing = false;
      if (code === "conflict") { $("#saveStatus").innerHTML = "<b>Ada versi lebih baru.</b> Halaman dimuat ulang; perubahanmu tersimpan sebagai draf di browser ini."; return; }
      if (["not_writer", "not_granted", "consent_required", "capability_disabled", "capability_removed", "not_declared"].includes(code)) { state.readOnly = true; updateSaveBar(); return; }
      updateSaveBar();
      $("#saveStatus").innerHTML = "<b>Gagal menerbitkan.</b> " + ({ too_large: "Data terlalu besar. Kurangi teks yang sangat panjang.", rate_limited: "Terlalu sering menyimpan. Tunggu sebentar lalu coba lagi.", invalid_content: "Isi halaman tidak valid. Muat ulang halaman lalu coba lagi." }[code] || "Coba lagi sebentar lagi. Drafmu tetap aman di browser ini.");
      $("#publishBtn").disabled = false; $("#discardBtn").disabled = false;
      return;
    }
  }
}

}

$("#alist").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const row = b.closest(".arow"); const ps = state.draft.products;
  const idx = ps.findIndex((x) => x.id === row.dataset.id); if (idx < 0) return;
  const act = b.dataset.act, id = ps[idx].id;
  if (act === "edit") return openEditor(idx, b);
  if (act === "up" || act === "down") {
    const j = act === "up" ? idx - 1 : idx + 1; if (j < 0 || j >= ps.length) return;
    [ps[idx], ps[j]] = [ps[j], ps[idx]]; changed({ list: true });
    const nb = $(`.arow[data-id="${CSS.escape(id)}"] button[data-act="${act}"]`); (nb && !nb.disabled ? nb : $(`.arow[data-id="${CSS.escape(id)}"] .btn-edit`)).focus();
    return;
  }
  if (act === "ask-delete") {
    $$(".arow-confirm").forEach((x) => x.remove());
    row.insertAdjacentHTML("beforeend", `<div class="arow-confirm" role="group" aria-label="Konfirmasi hapus"><span>Hapus <b>${esc(ps[idx].title)}</b> dari toko? Bisa dibatalkan dengan Buang perubahan sebelum diterbitkan.</span><span class="actions"><button class="btn btn-danger btn-sm" type="button" data-act="delete">Ya, hapus</button><button class="btn btn-ghost btn-sm" type="button" data-act="cancel-delete">Batal</button></span></div>`);
    $('[data-act="cancel-delete"]', row).focus(); return;
  }
  if (act === "cancel-delete") { b.closest(".arow-confirm").remove(); $('[data-act="ask-delete"]', row).focus(); return; }
  if (act === "delete") { const name = ps[idx].title; ps.splice(idx, 1); changed({ list: true }); toast(`${name} dihapus dari draf`); $("#addProduct").focus(); }
});

  if (el.dataset.path === "store.since") { v = v.replace(/\D/g, "").slice(0, 4); el.value = v; v = v.length === 4 ? Number(v) : v; }
  setPath(state.draft, el.dataset.path, v);
  el.removeAttribute("aria-invalid");
  changed();
});
async function uploadImage(file, statusEl) {
  if (!state.assets || !file) return null;
  if (!/^image\/(png|jpeg|webp|svg\+xml)$/.test(file.type)) { statusEl.textContent = "Format belum didukung. Pakai PNG, JPG, WEBP, atau SVG."; return null; }
  statusEl.textContent = "Mengunggah…";
  try { const r = await state.assets.upload(file); statusEl.textContent = "Logo terunggah. Masuk ke draf."; return r.id; }
  catch (err) {
    const code = err && err.code;
    statusEl.textContent = { too_large: "File terlalu besar. Maksimal 20 MB (SVG 2 MB).", unsupported_type: "Format belum didukung. Pakai PNG, JPG, WEBP, atau SVG.", quota_exceeded: "Ruang penyimpanan logo penuh. Hapus logo lama dulu.", rate_limited: "Terlalu sering mengunggah. Coba lagi sebentar lagi." }[code] || "Gagal mengunggah. Coba lagi.";
    return null;
  }
}

  const io = new IntersectionObserver(([e]) => document.body.classList.toggle("hero-visible", e.isIntersecting), { rootMargin: "-80px 0px 0px 0px" });
  io.observe($("#heroTitle"));

// Mode kelola muncul hanya jika runtime claude.ai menyatakan viewer bisa mengedit halaman ini.
(async () => {
  const cl = window.claude;
  if (!cl || typeof cl.use !== "function") return;
  let can = false;
  try { const user = await cl.use("user"); can = user ? await user.canEdit() : false; } catch (_) { can = false; }
  if (!can) return;
  state.editor = true;
  try { state.artifact = await cl.use("artifact"); } catch (_) { state.artifact = null; }
  try { state.assets = await cl.use("assets"); } catch (_) { state.assets = null; }
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      if (saved && saved.draft && JSON.stringify(saved.draft) !== JSON.stringify(state.data)) {
        if (saved.base === hash(JSON.stringify(state.data))) state.draft = saved.draft;
        else { pendingDraft = saved.draft; $("#draftNotice").hidden = false; }
      }
    }
  } catch (_) {}
  setRoute();
})();
})();
